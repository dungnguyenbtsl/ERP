<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ In & Xuất File Word</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-group {
            margin-top: 20px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-print {
            background-color: #007bff;
            color: white;
        }
        .btn-print:hover { background-color: #0056b3; }
        .btn-word {
            background-color: #28a745;
            color: white;
        }
        .btn-word:hover { background-color: #218838; }

        /* KHUNG XEM TRƯỚC (Giống bản in và file Word) */
        .preview-box {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #007bff;
            background: #fff;
            border-radius: 6px;
        }
        .print-template {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Arial', sans-serif;
        }
        .print-template th, .print-template td {
            border: 1px solid #000;
            padding: 8px 12px;
            text-align: left;
        }
        .print-template th {
            background-color: #f2f2f2;
        }
        .title-phieu {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhập liệu & Xuất Phiếu</h2>

    <!-- Phần Nhập Liệu -->
    <div class="form-group">
        <label>Mã Đơn Đặt Hàng / Mã Đơn Sản Xuất:</label>
        <input type="text" id="inputMa" placeholder="Nhập mã đơn hàng..." oninput="capNhatPreview()">
    </div>
    <div class="form-group">
        <label>Tên Nguyên Phụ Liệu / Sản Phẩm:</label>
        <input type="text" id="inputTen" placeholder="Nhập tên hàng..." oninput="capNhatPreview()">
    </div>
    <div class="form-group">
        <label>Số Lượng (數量):</label>
        <input type="text" id="inputSoLuong" placeholder="Nhập số lượng..." oninput="capNhatPreview()">
    </div>
    <div class="form-group">
        <label>Đơn Vị (單位):</label>
        <input type="text" id="inputDonVi" placeholder="Nhập đơn vị (Thùng, Cái...)..." oninput="capNhatPreview()">
    </div>

    <!-- Khung Xem Trước (Preview) -->
    <div class="preview-box">
        <div id="khung-xem-truoc">
            <div class="title-phieu">PHIẾU THÔNG TIN NGUYÊN PHỤ LIỆU</div>
            <table class="print-template">
                <tr>
                    <th style="width: 35%;">Thông tin</th>
                    <th>Nội dung chi tiết</th>
                </tr>
                <tr>
                    <td><strong>Mã đơn hàng:</strong></td>
                    <td><span id="prevMa">...</span></td>
                </tr>
                <tr>
                    <td><strong>Tên hàng:</strong></td>
                    <td><span id="prevTen">...</span></td>
                </tr>
                <tr>
                    <td><strong>Số lượng (數量):</strong></td>
                    <td><span id="prevSoLuong">...</span></td>
                </tr>
                <tr>
                    <td><strong>Đơn vị (單位):</strong></td>
                    <td><span id="prevDonVi">...</span></td>
                </tr>
            </table>
        </div>

        <!-- Nút thao tác -->
        <div class="btn-group">
            <button class="btn-print" onclick="window.print()">🖨️ In Trực Tiếp</button>
            <button class="btn-word" onclick="xuatFileWord('khung-xem-truoc', 'Phieu_Nguyen_Phu_Lieu.doc')">📄 Xuất File Word</button>
        </div>
    </div>
</div>

<script>
    // Hàm cập nhật thời gian thực từ ô nhập liệu lên khung xem trước
    function capNhatPreview() {
        document.getElementById('prevMa').innerText = document.getElementById('inputMa').value || '...';
        document.getElementById('prevTen').innerText = document.getElementById('inputTen').value || '...';
        document.getElementById('prevSoLuong').innerText = document.getElementById('inputSoLuong').value || '...';
        document.getElementById('prevDonVi').innerText = document.getElementById('inputDonVi').value || '...';
    }

    // Hàm xuất nội dung khung xem trước thành file Word (.doc)
    function xuatFileWord(elementId, filename = 'Tai_Khoan.doc') {
        var htmlContent = document.getElementById(elementId).innerHTML;

        var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                     "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                     "xmlns='http://www.w3.org/TR/REC-html40'>" +
                     "<head><meta charset='utf-8'>" +
                     "<style>" +
                     "  body { font-family: 'Arial', sans-serif; margin: 20px; }" +
                     "  .title-phieu { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 15px; }" +
                     "  table { border-collapse: collapse; width: 100%; font-family: 'Arial', sans-serif; }" +
                     "  td, th { border: 1px solid #000; padding: 8px 12px; text-align: left; }" +
                     "  th { background-color: #f2f2f2; }" +
                     "</style></head><body>";
                     
        var footer = "</body></html>";
        var sourceHTML = header + htmlContent + footer;

        var blob = new Blob(['\ufeff', sourceHTML], {
            type: 'application/msword'
        });

        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
