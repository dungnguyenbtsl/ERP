<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Vật Tư SAUCONY</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #1a73e8; }
    input, select, button { padding: 8px 12px; margin: 4px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #1a73e8; color: white; border: none; cursor: pointer; }
    button:hover { background: #1557b0; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
    th { background: #f1f3f4; }
    .status-ok { background-color: #d4edda; color: #155724; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
    .status-pending { background-color: #fff3cd; color: #856404; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔗 Cấu Hình Web App 2 Chiều</h2>
    <label>Nhập Web App URL (GAS): </label>
    <input type="text" id="scriptUrl" style="width: 60%;" placeholder="https://script.google.com/macros/s/.../exec">
    <button onclick="loadData()">🔄 Tải Dữ Liệu</button>
  </div>

  <div class="card">
    <h2>📦 Danh Sách Vật Tư SAUCONY</h2>
    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Tìm theo Mã Đơn / Tên Vật Tư / Chỉ Lệnh...">
    
    <table id="dataTable">
      <thead>
        <tr id="tableHeader">
          <th>Dòng</th>
          <th>Mã Đơn / 指令表</th>
          <th>Tên Vật Tư / 材料名稱</th>
          <th>Số Lượng / 數量</th>
          <th>Trạng Thái / 狀態</th>
          <th>Người Nhận</th>
          <th>Thao Tác Ghi Đổi</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7" style="text-align:center;">Chưa có dữ liệu. Vui lòng dán URL và bấm Tải Dữ Liệu.</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let sheetData = [];

    // 1. TẢI DỮ LIỆU TỪ GOOGLE SHEETS
    async function loadData() {
      const url = document.getElementById('scriptUrl').value.trim();
      if (!url) return alert("Vui lòng nhập Web App URL!");

      const body = document.getElementById('tableBody');
      body.innerHTML = '<tr><td colspan="7" style="text-align:center;">⏳ Đang tải dữ liệu từ Google Sheets...</td></tr>';

      try {
        const res = await fetch(url);
        sheetData = await res.json();
        renderTable(sheetData);
      } catch (err) {
        alert("Lỗi tải dữ liệu: " + err.message);
      }
    }

    // 2. HIỂN THỊ BẢNG
    function renderTable(data) {
      const body = document.getElementById('tableBody');
      body.innerHTML = '';

      data.forEach(row => {
        const tr = document.createElement('tr');
        
        // Tìm linh hoạt tên cột tương ứng trong file Excel/Sheets của bạn
        const po = row['*訂購單號'] || row['指令表'] || row['Mã Đơn'] || '-';
        const name = row['材料名稱'] || row['Tên Vật Tư'] || '-';
        const qty = row['數量'] || row['Số Lượng'] || '0';
        const status = row['货物状态'] || row['Trạng Thái'] || 'Chờ tiếp nhận';
        const receiver = row['接收人員'] || row['Người Nhận'] || '';

        tr.innerHTML = `
          <td><b>#${row._rowIndex}</b></td>
          <td>${po}</td>
          <td>${name}</td>
          <td>${qty}</td>
          <td>
            <span class="${status.includes('OK') ? 'status-ok' : 'status-pending'}">
              ${status}
            </span>
          </td>
          <td><input type="text" id="rec_${row._rowIndex}" value="${receiver}" style="width:100px;"></td>
          <td>
            <button onclick="updateRow(${row._rowIndex}, '穫準使用的材料(OK)')">✅ Duyệt OK</button>
            <button onclick="updateRow(${row._rowIndex}, '有问题的材料(PD)')" style="background:#dc3545;">⚠️ Báo Lỗi</button>
          </td>
        `;
        body.appendChild(tr);
      });
    }

    // 3. GHI NGUỢC DỮ LIỆU VỀ GOOGLE SHEETS (POST)
    async function updateRow(rowIndex, newStatus) {
      const url = document.getElementById('scriptUrl').value.trim();
      const receiverVal = document.getElementById(`rec_${rowIndex}`).value;

      if (!url) return alert("Thiếu URL Web App!");

      // Xác định vị trí cột cần sửa trong Google Sheets (Ví dụ: Cột 20 là Trạng Thái, Cột 22 là Người Nhận)
      // *Bạn có thể chỉnh lại vị trí số cột (Col Index) cho chuẩn với file Sheet thực tế của bạn*
      const payload = {
        rowIndex: rowIndex,
        updates: [
          { col: 20, val: newStatus },     // Cột T (Column 20)
          { col: 22, val: receiverVal }    // Cột V (Column 22)
        ]
      };

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors', // Bỏ qua CORS restriction từ Google Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert(`✅ Đã ghi dữ liệu thành công dòng #${rowIndex} lên Google Sheets!`);
        loadData(); // Tải lại bảng để cập nhật giao diện
      } catch (err) {
        alert("❌ Lỗi khi ghi dữ liệu: " + err.message);
      }
    }

    // 4. LỌC TÌM KIẾM
    function filterTable() {
      const val = document.getElementById('searchInput').value.toLowerCase();
      const filtered = sheetData.filter(r => 
        JSON.stringify(r).toLowerCase().includes(val)
      );
      renderTable(filtered);
    }
  </script>
</body>
</html>
